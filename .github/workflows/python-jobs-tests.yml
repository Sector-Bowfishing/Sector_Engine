# Offline unit tests for the Python jobs and the Brain Platform package. No credentials, no cloud access:
# Brain writer credentials never live in GitHub (docs/brains/JOBS_CONTRACT.md).
# Swift is a separate workflow (swift-tests.yml); the repository foundation / architecture / verification
# gates are in foundation-verification.yml.
#
# Legacy job suites are listed EXPLICITLY (those Brains are not migrated; no brain.json). Migrated Brains (brains/*/brain.json:
# Wind since Repository Phase 2, Fish, Water Clarity, Sector Intelligence) run in the `registered-brains` job from their canonical location. Do not invent brain.json files.
name: python-jobs-tests
on:
  push:
    branches: [main]
    paths: ["jobs/**", "brains/**", "providers/**", "tools/**", "docs/cortex/**", "contracts/**", "verification/integration/test_wind_package.py", "contracts/conformance/**", "docs/brains/scoring/**", ".github/workflows/python-jobs-tests.yml"]
  pull_request:
    paths: ["jobs/**", "brains/**", "providers/**", "tools/**", "docs/cortex/**", "contracts/**", "verification/integration/test_wind_package.py", "contracts/conformance/**", "docs/brains/scoring/**", ".github/workflows/python-jobs-tests.yml"]
permissions:
  contents: read
jobs:
  platform:
    name: python-platform (brain_platform, orchestrator, scores)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest numpy requests google-cloud-storage
      - name: Platform suites (offline)
        run: |
          set -e
          for d in jobs/brain_platform jobs/brain-orchestrator jobs/brain-scores; do
            echo "== $d"; (cd "$d" && python -m pytest -q)
          done

  brains:
    name: python-jobs (legacy Brain/job suites, explicit list)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest numpy requests google-cloud-storage
      - name: Brain and job suites (offline)
        run: |
          set -e
          for d in jobs/lake-surface-dispatch \
                   jobs/water-temp-tva-archive \
                   jobs/lake-brain/bindings jobs/lake-brain/ledger jobs/lake-brain/validation jobs/lake-brain/review; do
            echo "== $d"; (cd "$d" && python -m pytest -q)
          done

  registered-brains:
    name: registered Brains (brains/*/brain.json; Wind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Declared dependency sources: each Brain's runtime/requirements.txt (production image deps) and
      # research/tools/requirements.txt (research-tool extras). pytest.ini in each Brain declares its import roots.
      - name: Install declared Brain dependencies
        run: |
          pip install pytest
          for b in brains/*/; do
            [ -f "$b/brain.json" ] || continue
            [ -f "$b/runtime/requirements.txt" ] && pip install -r "$b/runtime/requirements.txt"
            [ -f "$b/research/tools/requirements.txt" ] && pip install -r "$b/research/tools/requirements.txt"
          done
      - name: Brain suites from their canonical location (network tests deselected by each pytest.ini)
        run: |
          set -e
          for b in brains/*/; do
            [ -f "$b/brain.json" ] || continue
            echo "== $b"; (cd "$b" && python -m pytest -q)
          done
      - name: Engineering status is current for THIS commit (re-runs every Kit V1 suite, compares with the committed record, emits a commit-stamped copy)
        run: |
          python tools/cortex_status/collect_certification.py
          git diff --exit-code -- docs/cortex/engineering-status/inputs/certification.json
          python tools/cortex_status/build_engineering_status.py --check
          python tools/cortex_status/build_engineering_status.py --emit "$RUNNER_TEMP/engineering-status.json" --commit "$GITHUB_SHA"
          python tools/cortex_status/ops_projection.py --report "$RUNNER_TEMP/engineering-status.json" --out "$RUNNER_TEMP/engineering-status-ops.json"
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-status
          path: |
            ${{ runner.temp }}/engineering-status.json
            ${{ runner.temp }}/engineering-status-ops.json
          retention-days: 90
      - name: Brain Certification Kit self-tests (BRAIN_CERT_KIT_V1; synthetic Brain, no real Brain involved)
        run: python -m pytest -q tools/brain_certification
      - name: Wind package gates (staging, import boundary, clean copy; dependency gates mandatory here)
        env:
          SECTOR_REQUIRE_WIND_DEPS: "1"
        run: python -m pytest -q verification/integration/test_wind_package.py

  lake-geometry:
    name: lake-geometry (declared requirements.txt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # shapely/pyproj/numpy/pytest are declared in jobs/lake-geometry/requirements.txt: that file is the canonical source.
      - run: pip install -r jobs/lake-geometry/requirements.txt
      - run: cd jobs/lake-geometry && python -m pytest -q
