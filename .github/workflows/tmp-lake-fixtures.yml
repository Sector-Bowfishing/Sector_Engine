# TEMPORARY (removed before review): regenerate the Lake publication golden for this branch and run the Lake Swift tests.
name: tmp-lake-fixtures
on:
  push:
    branches: [feat/lake-smart-freshness-2026-11-21]
    paths: [".github/workflows/tmp-lake-fixtures.yml", "brains/lake/**"]
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: SECTOR_WRITE_BRAIN_FIXTURES=1 swift test --skip-build --filter LakePublicationFixtureTests || true
      - run: swift test --skip-build --filter LakeBrainTests 2>&1 | tee lake-tests.log || true
      - name: print regenerated golden
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"; git status --short
          git diff --stat
          tar czf - brains/lake/tests/golden | base64 -w0 > golden.b64
          echo "GOLDEN_B64_BEGIN"; cat golden.b64; echo; echo "GOLDEN_B64_END"
