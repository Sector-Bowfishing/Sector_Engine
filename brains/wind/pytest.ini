[pytest]
# Wind Brain tests (brains/wind). Import roots are declared here instead of sys.path shims:
#   runtime/                   the production package `sector_wind` + main.py
#   research/tools             the research-only package `sector_wind_research` (research tool tests only; production
#                              code never imports it — enforced by verification/integration/test_wind_package.py)
#   ../../jobs/brain_platform  the shared Brain Platform (legacy location until the platform package migrates)
testpaths = tests research/tools/tests
pythonpath = runtime research/tools ../../jobs/brain_platform ../../tools/brain_certification
addopts = -m "not network"
markers =
    network: needs NOAA AWS + IEM (run with -m network)
