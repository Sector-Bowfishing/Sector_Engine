[pytest]
# Vegetation Brain tests (brains/vegetation). Import roots:
#   runtime/                   the production package `vegetation_brain` + run.py
#   research/tools             the offline research package `vegetation_research` (tests may use it to build fixtures; runtime never imports it)
#   tests                      shared helpers (helpers.py)
#   ../../jobs/brain_platform  the shared Brain Platform
testpaths = tests research/tools/tests
pythonpath = runtime research/tools tests . ../../jobs/brain_platform ../../tools/brain_certification
