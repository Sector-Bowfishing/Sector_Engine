[pytest]
# Python side of a Swift Brain: the shadow Publisher builder (runtime/publish_artifact.py) and the Certification Kit adapter. Swift tests live in
# tests/swift and run with `swift test`; the golden write set in tests/golden is produced only by the Swift fixture test.
pythonpath = runtime tools tests ../../jobs/brain_platform ../../tools/brain_certification
testpaths = tests
norecursedirs = swift golden
