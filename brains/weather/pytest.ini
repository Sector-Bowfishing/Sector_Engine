[pytest]
# Weather Brain tests (brains/weather). Import roots:
#   runtime/                   the production package `sector_weather` + run.py
#   tests                      shared helpers (weather_support.py)
#   ../../jobs/brain_platform  the shared Brain Platform
testpaths = tests
pythonpath = runtime tests ../../jobs/brain_platform ../../tools/brain_certification
addopts = -m "not network"
markers =
    network: needs the live NWS API (deselected by default)
