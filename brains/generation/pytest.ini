[pytest]
# Generation Brain tests (brains/generation). Import roots:
#   runtime/                   the production package `generation_brain` + run.py
#   research/tools             the offline research package `generation_research` (research tool tests only; runtime never imports it)
#   tests                      shared helpers
#   ../../jobs/brain_platform  the shared Brain Platform
testpaths = tests research/tools/tests
pythonpath = runtime research/tools tests . ../../jobs/brain_platform ../../tools/brain_certification
