[pytest]
# Depth Brain tests (brains/depth). Import roots:
#   runtime/                   the production package `depth_brain` + run.py
#   research/tools             the offline research package `depth_research` (research tool tests only; runtime never imports it)
#   tests                      shared helpers (helpers.py)
#   ../../jobs/brain_platform  the shared Brain Platform
testpaths = tests research/tools/tests
pythonpath = runtime research/tools tests . ../../jobs/brain_platform ../../tools/brain_certification
markers =
    research_data: needs the Depth research dataset snapshot ($DEPTH_RESEARCH_DATA); skipped when it is absent
